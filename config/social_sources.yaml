sources:
  - id: "nitter_cali"
    name: "Nitter Cali"
    type: "nitter"
    enabled: true
    prefer_browser: true
    instances:
      - "https://nitter.net"
      - "https://nitter.poast.org"
      - "https://nitter.privacydev.net"
      - "https://nitter.1d4.us"
    search_queries:
      - "seguridad cali"
      - "hurto cali"
      - "inseguridad cali"
      - "mio cali seguridad"
    max_posts: 20

  - id: "youtube_cali"
    name: "YouTube Cali Seguridad"
    type: "youtube"
    enabled: true
    search_queries:
      - "seguridad cali"
      - "inseguridad cali"
      - "homicidio cali"
    channel_urls: []
    video_urls: []
    max_videos_per_query: 2
    max_videos_per_channel: 5
    max_comments_per_video: 8
    transcript_languages: ["es", "es-419", "en"]
    audio_transcription_enabled: true
    whisper_model: "tiny"
    whisper_device: "auto"
    whisper_compute_type: "int8"

  - id: "facebook_publico_cali"
    name: "Facebook Publico Cali"
    type: "facebook"
    enabled: true
    prefer_browser: true
    page_urls:
      - "https://mbasic.facebook.com/AlcaldiaDeCali/"
      - "https://mbasic.facebook.com/PoliciaCali/"
      - "https://mbasic.facebook.com/BLURadioCali/"
    max_posts_per_page: 8

  - id: "instagram_cali"
    name: "Instagram Cali Noticias"
    type: "instagram"
    enabled: true
    prefer_browser: true
    # Autenticacion: usar UNO de los dos metodos:
    # 1. cookies_file: exportar cookies.txt desde Chrome con extension "Get cookies.txt LOCALLY"
    # 2. cookies_from_browser: "chrome" (requiere Chrome cerrado)
    cookies_file: "config/instagram_cookies.txt"
    cookies_from_browser: null
    profile_urls:
      - "https://www.instagram.com/alertacalidad/"
      - "https://www.instagram.com/cali_informa/"
      - "https://www.instagram.com/enteratecali/"
      - "https://www.instagram.com/ultimahoracalioficial/"
      - "https://www.instagram.com/elcalenoviral/"
      - "https://www.instagram.com/calioknoticias/"
      - "https://www.instagram.com/radiorelojcali/"
      - "https://www.instagram.com/calivenoticias/"
      - "https://www.instagram.com/quepasaencali/"
      - "https://www.instagram.com/lanoticiaencali/"
      - "https://www.instagram.com/radiosupercali/"
      - "https://www.instagram.com/calisincensura/"
      - "https://www.instagram.com/cwnoticias/"
      - "https://www.instagram.com/colombiaoscura/"
      - "https://www.instagram.com/caliactivaoficial/"
      - "https://www.instagram.com/tubarco/"
      - "https://www.instagram.com/tomennotacali/"
      - "https://www.instagram.com/zonacnoticiasoficial/"
      - "https://www.instagram.com/elpaiscali/"
    post_urls: []
    hashtags:
      - "seguridadcali"
      - "inseguridadcali"
      - "hurtoscali"
      - "violenciacali"
      - "homicidioscali"
      - "feminicidiocali"
      - "narcotraficocali"
      - "estafacali"
      - "roboscali"
      - "cali"
    # Keywords para filtrar posts relevantes (si el post no contiene al menos uno, se descarta)
    filter_keywords:
      - "cali"
      - "santiago de cali"
      - "seguridad"
      - "inseguridad"
      - "homicidio"
      - "asesinato"
      - "hurto"
      - "robo"
      - "atraco"
      - "fleteo"
      - "estafa"
      - "estafador"
      - "fraude"
      - "narcotrafico"
      - "narcotráfico"
      - "microtráfico"
      - "microtrafico"
      - "droga"
      - "cocaina"
      - "reclutamiento forzado"
      - "reclutamiento"
      - "disidencia"
      - "grupo armado"
      - "guerrilla"
      - "feminicidio"
      - "femicidio"
      - "violencia de género"
      - "violencia de genero"
      - "violencia intrafamiliar"
      - "abuso sexual"
      - "sicariato"
      - "balacera"
      - "tiroteo"
      - "apuñalado"
      - "puñalada"
      - "extorsión"
      - "extorsion"
      - "secuestro"
      - "desaparecido"
      - "desaparecida"
      - "pandilla"
      - "delincuencia"
      - "policía"
      - "policia"
      - "capturado"
      - "captura"
      - "operativo"
      - "muerto"
      - "víctima"
      - "victima"
      - "riña"
      - "accidente"
      - "emergencia"
      - "masacre"
      - "banda criminal"
      - "bacrim"
